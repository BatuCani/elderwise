<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" font-family="Georgia, 'Times New Roman', serif">
  <rect width="800" height="1100" fill="#ffffff"/>
  <text x="60" y="80" font-size="30" font-weight="bold" fill="#1a3a6b">Praxis Dr. med. A. Beispiel</text>
  <text x="60" y="112" font-size="20" fill="#333">Fachärztin für Innere Medizin · Musterstraße 1 · 10115 Berlin</text>
  <line x1="60" y1="135" x2="740" y2="135" stroke="#1a3a6b" stroke-width="2"/>
  <text x="60" y="190" font-size="22" fill="#000">Frau Erika Mustermann (Beispieldaten)</text>
  <text x="560" y="190" font-size="22" fill="#000">Berlin, 14.10.2026</text>
  <text x="60" y="250" font-size="24" font-weight="bold" fill="#000">Befundbericht</text>
  <text font-size="22" fill="#000">
    <tspan x="60" y="300">Diagnose: Arterielle Hypertonie (ED 2019), Hypercholesterinämie.</tspan>
    <tspan x="60" y="345">Labor: LDL-Cholesterin 168 mg/dl (Zielwert &lt; 115 mg/dl),</tspan>
    <tspan x="60" y="380">HbA1c 5,6 % (im Normbereich), Kreatinin unauffällig.</tspan>
    <tspan x="60" y="425">RR in der Praxis 152/94 mmHg.</tspan>
    <tspan x="60" y="485">Procedere: Neu Atorvastatin 20 mg 1-0-0, morgens.</tspan>
    <tspan x="60" y="520">Ramipril 5 mg 1-0-0 unverändert fortführen.</tspan>
    <tspan x="60" y="555">Häusliche RR-Messung 2x tgl., Protokoll mitbringen.</tspan>
    <tspan x="60" y="590">Kontrolle Lipidprofil in 3 Monaten (WV 01/2027).</tspan>
    <tspan x="60" y="650">Bei Muskelschmerzen bitte umgehend vorstellig werden.</tspan>
  </text>
  <text x="60" y="760" font-size="22" fill="#000">Mit freundlichen Grüßen</text>
  <text x="60" y="830" font-size="30" font-style="italic" fill="#1a3a6b">A. Beispiel</text>
  <text x="60" y="1060" font-size="16" fill="#888">Fiktives Beispiel für die Orbs-Demo. Keine echten Personendaten.</text>
</svg>
