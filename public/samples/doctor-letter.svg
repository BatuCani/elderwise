<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.48  0 0 0 0 0.44  0 0 0 0.06 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffefa"/><stop offset="1" stop-color="#f1ede3"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#c9c4b8"/>
  <g transform="rotate(-1.2 540 675)">
    <rect x="70" y="50" width="940" height="1250" fill="#000" opacity=".12" transform="translate(8 10)"/>
    <rect x="70" y="50" width="940" height="1250" fill="url(#shade)"/>
    <rect x="70" y="50" width="940" height="1250" filter="url(#paper)"/>
    <!-- logo -->
    <circle cx="170" cy="150" r="44" fill="none" stroke="#1d4f7a" stroke-width="6"/>
    <path d="M170 122 v56 M142 150 h56" stroke="#1d4f7a" stroke-width="10" stroke-linecap="round"/>
    <text x="240" y="145" font-size="40" font-weight="bold" fill="#1d4f7a">Praxis Dr. Weber</text>
    <text x="240" y="182" font-size="24" fill="#4a4a4a" font-family="Helvetica, Arial, sans-serif">General Practice · Internal Medicine</text>
    <text x="960" y="130" font-size="20" fill="#4a4a4a" text-anchor="end" font-family="Helvetica, Arial, sans-serif">Lindenweg 12 · 00000 Musterstadt</text>
    <text x="960" y="158" font-size="20" fill="#4a4a4a" text-anchor="end" font-family="Helvetica, Arial, sans-serif">Tel. 000 123 456</text>
    <line x1="120" y1="220" x2="960" y2="220" stroke="#1d4f7a" stroke-width="3"/>
    <text x="120" y="300" font-size="26" fill="#222">Mrs. Example Patient</text>
    <text x="120" y="335" font-size="26" fill="#222">Sample Street 1</text>
    <text x="960" y="300" font-size="26" fill="#222" text-anchor="end">14 October 2026</text>
    <text x="120" y="430" font-size="34" font-weight="bold" fill="#111">Medical Report</text>
    <text font-size="28" fill="#222">
      <tspan x="120" y="500">Dear Mrs. Patient,</tspan>
      <tspan x="120" y="560">following your examination on 10 October 2026</tspan>
      <tspan x="120" y="600">we report the following findings:</tspan>
    </text>
    <text x="120" y="680" font-size="28" font-weight="bold" fill="#111">Diagnosis:</text>
    <text x="300" y="680" font-size="28" fill="#222">mild arterial hypertension (I10.00)</text>
    <text font-size="28" fill="#222">
      <tspan x="120" y="730">BP 148/92 mmHg, HR 76/min, ECG: sinus rhythm,</tspan>
      <tspan x="120" y="770">no signs of left ventricular hypertrophy.</tspan>
    </text>
    <text x="120" y="850" font-size="28" font-weight="bold" fill="#111">Recommendation:</text>
    <text font-size="28" fill="#222">
      <tspan x="120" y="895">reduce sodium intake (&lt; 5 g NaCl/day), regular</tspan>
      <tspan x="120" y="935">aerobic exercise, home BP monitoring twice daily.</tspan>
      <tspan x="120" y="975">Follow-up in 4 weeks.</tspan>
    </text>
    <text x="120" y="1070" font-size="28" fill="#222">Kind regards,</text>
    <path d="M130 1150 q30 -50 60 -10 t60 -5 q20 -30 40 0 t50 -10 q30 20 70 -20" fill="none" stroke="#1d3f8a" stroke-width="4" stroke-linecap="round"/>
    <text x="120" y="1200" font-size="24" fill="#444">Dr. med. K. Weber</text>
    <circle cx="820" cy="1140" r="70" fill="none" stroke="#3b5ba0" stroke-width="4" opacity=".55"/>
    <text x="820" y="1135" font-size="20" fill="#3b5ba0" text-anchor="middle" opacity=".6" font-family="Helvetica, Arial, sans-serif">PRAXIS</text>
    <text x="820" y="1160" font-size="20" fill="#3b5ba0" text-anchor="middle" opacity=".6" font-family="Helvetica, Arial, sans-serif">DR. WEBER</text>
    <text x="540" y="1275" font-size="18" fill="#999" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Fictional example for the Elderwise demo. No real personal data.</text>
  </g>
</svg>
