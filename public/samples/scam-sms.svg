    <tspan x="100" y="570">DHL: Your parcel is waiting.</tspan>
    <tspan x="100" y="626">Pay a 1.99 EUR customs fee</tspan>
    <tspan x="100" y="682">within 24h, or the parcel will</tspan>
    <tspan x="100" y="738">be returned to the sender:</tspan>
  </text>
  <text x="100" y="808" font-size="42" fill="#007aff" text-decoration="underline">dhl-customs-parcel.info</text>
  <text x="100" y="870" font-size="30" fill="#6b6b70">Ref: DE-48211-PKG</text>
