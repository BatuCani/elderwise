  <g fill="#000">
    <rect x="850" y="48" width="8" height="14" rx="2"/><rect x="864" y="42" width="8" height="20" rx="2"/>
    <rect x="878" y="36" width="8" height="26" rx="2"/><rect x="892" y="30" width="8" height="32" rx="2" opacity=".35"/>
    <rect x="930" y="34" width="62" height="30" rx="8" fill="none" stroke="#000" stroke-width="3" opacity=".5"/>
    <rect x="935" y="39" width="40" height="20" rx="4"/><rect x="996" y="43" width="5" height="12" rx="2" opacity=".5"/>
  </g>
  <!-- header -->
  <rect y="100" width="1080" height="230" fill="#f6f6f8"/>
