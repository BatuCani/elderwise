  <text x="540" y="448" font-size="26" fill="#8e8e93" text-anchor="middle">Today 08:17</text>
  <!-- bubble -->
  <path d="M60 500 h700 a44 44 0 0 1 44 44 v330 a44 44 0 0 1 -44 44 h-660 a44 44 0 0 1 -44 -44 v-330 a44 44 0 0 1 44 -44z" fill="#e9e9eb"/>
  <path d="M60 880 q-6 30 -26 40 q36 2 60 -18z" fill="#e9e9eb"/>
