  <rect y="1200" width="1080" height="150" fill="#f6f6f8"/>
  <circle cx="80" cy="1265" r="34" fill="#e3e3e8"/>
  <path d="M80 1248 v34 M63 1265 h34" stroke="#8e8e93" stroke-width="5" stroke-linecap="round"/>
