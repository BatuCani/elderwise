  <rect x="60" y="960" width="600" height="150" rx="30" fill="#e9e9eb"/>
  <rect x="60" y="960" width="150" height="150" rx="30" fill="#ffcc00"/>
  <rect x="88" y="1010" width="94" height="22" rx="4" fill="#d40511"/>
  <rect x="88" y="1040" width="94" height="10" rx="3" fill="#d40511"/>
  <text x="240" y="1025" font-size="32" font-weight="600" fill="#000">Parcel Customs Fee</text>
  <text x="240" y="1070" font-size="28" fill="#8e8e93">dhl-customs-parcel.info</text>
