<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="-apple-system, Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1080" height="1350" fill="#efe7de"/>
  <!-- wallpaper doodles -->
  <g fill="none" stroke="#e2d8cc" stroke-width="4">
    <circle cx="140" cy="420" r="30"/><path d="M880 460 l40 40 m0 -40 l-40 40"/><rect x="760" y="760" width="50" height="50" rx="10"/>
    <circle cx="220" cy="1050" r="24"/><path d="M600 1120 q30 -40 60 0 t60 0"/><circle cx="960" cy="1000" r="20"/>
  </g>
  <!-- status bar -->
  <rect width="1080" height="100" fill="#f7f8fa"/>
  <text x="80" y="68" font-size="34" font-weight="600" fill="#000">14:02</text>
  <rect x="930" y="36" width="62" height="30" rx="8" fill="none" stroke="#000" stroke-width="3" opacity=".5"/>
  <rect x="935" y="41" width="30" height="20" rx="4"/>
  <!-- header -->
  <rect y="100" width="1080" height="150" fill="#f7f8fa"/>
  <line x1="0" y1="250" x2="1080" y2="250" stroke="#dcdcdc" stroke-width="2"/>
  <path d="M60 155 l-22 22 l22 22" fill="none" stroke="#007aff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="177" r="44" fill="#cfd4da"/>
  <circle cx="150" cy="163" r="16" fill="#fff"/><path d="M120 205 a30 26 0 0 1 60 0z" fill="#fff"/>
  <text x="215" y="170" font-size="36" font-weight="600" fill="#000">+44 7700 900 461</text>
  <text x="215" y="212" font-size="26" fill="#8e8e93">online</text>
  <!-- unknown number banner -->
  <rect x="140" y="290" width="800" height="120" rx="20" fill="#fdf4c5"/>
  <text x="540" y="340" font-size="26" fill="#54493a" text-anchor="middle">This number is not in your contacts.</text>
  <text x="540" y="385" font-size="26" fill="#54493a" text-anchor="middle">Block · Add to contacts</text>
  <rect x="440" y="440" width="200" height="50" rx="14" fill="#e1f2fb"/>
  <text x="540" y="474" font-size="26" fill="#54656f" text-anchor="middle">TODAY</text>
  <!-- bubbles -->
  <rect x="50" y="520" width="720" height="130" rx="26" fill="#fff"/>
  <text font-size="40" fill="#111b21"><tspan x="85" y="582">Hi Grandma, this is my new</tspan><tspan x="85" y="630">number 😊</tspan></text>
  <text x="740" y="632" font-size="22" fill="#8696a0" text-anchor="end">13:58</text>
  <rect x="50" y="670" width="720" height="80" rx="26" fill="#fff"/>
  <text x="85" y="723" font-size="40" fill="#111b21">My phone broke.</text>
  <text x="740" y="732" font-size="22" fill="#8696a0" text-anchor="end">13:58</text>
  <rect x="50" y="770" width="780" height="230" rx="26" fill="#fff"/>
  <text font-size="40" fill="#111b21"><tspan x="85" y="832">I need 900 euro today for a</tspan><tspan x="85" y="880">bill, I will pay you back next</tspan><tspan x="85" y="928">week. Please don't tell Mum 🙏</tspan></text>
  <text x="800" y="982" font-size="22" fill="#8696a0" text-anchor="end">13:59</text>
  <!-- grandma's reply -->
  <rect x="520" y="1030" width="510" height="80" rx="26" fill="#d9fdd3"/>
  <text x="555" y="1083" font-size="40" fill="#111b21">Who is this?</text>
  <text x="1000" y="1092" font-size="22" fill="#53bdeb" text-anchor="end">14:01 ✓✓</text>
  <rect x="50" y="1130" width="560" height="80" rx="26" fill="#fff"/>
  <text x="85" y="1183" font-size="40" fill="#111b21">It's me!! Quick please</text>
  <text x="580" y="1192" font-size="22" fill="#8696a0" text-anchor="end">14:02</text>
  <!-- input -->
  <rect y="1240" width="1080" height="110" fill="#f7f8fa"/>
  <rect x="90" y="1258" width="800" height="70" rx="35" fill="#fff" stroke="#dcdcdc" stroke-width="2"/>
  <text x="130" y="1304" font-size="30" fill="#a0a0a5">Message</text>
  <circle cx="970" cy="1293" r="38" fill="#25a366"/>
  <rect x="960" y="1272" width="20" height="30" rx="10" fill="#fff"/>
</svg>
