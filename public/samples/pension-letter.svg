<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="#8c9aa3"/>
  <g transform="rotate(0.8 540 675)">
    <rect x="60" y="40" width="960" height="1270" fill="#000" opacity=".15" transform="translate(8 10)"/>
    <rect x="60" y="40" width="960" height="1270" fill="#fdfdfb"/>
    <rect x="60" y="40" width="960" height="1270" filter="url(#paper)"/>
    <!-- fold line -->
    <line x1="60" y1="460" x2="1020" y2="460" stroke="#000" stroke-opacity=".05" stroke-width="3"/>
    <!-- logo -->
    <rect x="110" y="95" width="70" height="70" rx="12" fill="#0b5a8a"/>
    <path d="M128 145 l17 -30 l17 30z" fill="#fff"/>
    <text x="200" y="128" font-size="34" font-weight="bold" fill="#0b5a8a">National Pension Office</text>
    <text x="200" y="162" font-size="22" fill="#555">Pension Service Centre · PO Box 0000</text>
    <text x="110" y="250" font-size="18" fill="#777">National Pension Office · PO Box 0000 · 00000 Sampletown</text>
    <text font-size="26" fill="#222"><tspan x="110" y="295">Mrs. Example Pensioner</tspan><tspan x="110" y="330">Sample Lane 5</tspan><tspan x="110" y="365">00000 Sampletown</tspan></text>
    <text font-size="22" fill="#333" text-anchor="end"><tspan x="970" y="295">Insurance no.: 00 000000 X 000</tspan><tspan x="970" y="328">Date: 2 October 2026</tspan></text>
    <text x="110" y="520" font-size="34" font-weight="bold" fill="#111">Notice of Pension Adjustment</text>
    <text x="110" y="560" font-size="24" fill="#333">pursuant to § 65 of the Pension Act (PA VI)</text>
    <text font-size="26" fill="#222">
      <tspan x="110" y="630">Dear Mrs. Pensioner,</tspan>
      <tspan x="110" y="680">due to the statutory pension adjustment, your</tspan>
      <tspan x="110" y="716">pension will be recalculated. From 1 November</tspan>
      <tspan x="110" y="752">your monthly pension changes from 1,284.50 EUR</tspan>
      <tspan x="110" y="788">to 1,311.20 EUR.</tspan>
    </text>
    <!-- table -->
    <rect x="110" y="830" width="860" height="250" fill="#f1f5f8" stroke="#c7d3dc" stroke-width="2"/>
    <line x1="110" y1="890" x2="970" y2="890" stroke="#c7d3dc" stroke-width="2"/>
    <text font-size="22" font-weight="bold" fill="#0b5a8a"><tspan x="135" y="870">Item</tspan><tspan x="650" y="870">until 31 Oct</tspan><tspan x="820" y="870">from 1 Nov</tspan></text>
    <text font-size="22" fill="#222">
      <tspan x="135" y="930">Gross pension</tspan><tspan x="650" y="930">1,436.80</tspan><tspan x="820" y="930">1,466.66</tspan>
      <tspan x="135" y="970">Health insurance contribution</tspan><tspan x="650" y="970">-  117.82</tspan><tspan x="820" y="970">-  120.27</tspan>
      <tspan x="135" y="1010">Long-term care contribution</tspan><tspan x="650" y="1010">-   34.48</tspan><tspan x="820" y="1010">-   35.19</tspan>
    </text>
    <line x1="110" y1="1030" x2="970" y2="1030" stroke="#c7d3dc" stroke-width="2"/>
    <text font-size="24" font-weight="bold" fill="#111"><tspan x="135" y="1065">Net payment</tspan><tspan x="650" y="1065">1,284.50</tspan><tspan x="820" y="1065">1,311.20</tspan></text>
    <text font-size="22" fill="#444">
      <tspan x="110" y="1140">You do not need to do anything. The amount is paid to your</tspan>
      <tspan x="110" y="1172">usual bank account. Appeal (objection) possible within one</tspan>
      <tspan x="110" y="1204">month of receipt of this notice.</tspan>
    </text>
    <text x="540" y="1280" font-size="18" fill="#999" text-anchor="middle">Fictional example for the Elderwise demo. No real personal data.</text>
  </g>
</svg>
